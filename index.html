<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1226">
<meta name="description" content="Daily Silver: six allies, one moonlit summit, one daily battle.">
<link rel="icon" href="./assets/art/daily-silver-mark-96.png" type="image/png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Daily Silver</title>
<link rel="stylesheet" href="./src/ui.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
 <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
 <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 9V3M7.5 15h9"/></symbol>
 <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5h10a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3zM8 8h7M8 11.5h7"/></symbol>
 <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.5-1.1 1-1.1 1.8M12 17h.01"/></symbol>
 <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9M13 4v6M7 14v6"/></symbol>
 <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4zM16.5 9a4.5 4.5 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></symbol>
 <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4zM17 9.5l4 5M21 9.5l-4 5"/></symbol>
 <symbol id="i-swap" viewBox="0 0 24 24"><path d="M5 8h13l-3.5-3.5M19 16H6l3.5 3.5"/></symbol>
 <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5h.01"/></symbol>
 <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
 <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
 <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
 <symbol id="i-skip" viewBox="0 0 24 24"><path d="M5 5l8 7-8 7zM14 5l8 7-8 7z"/></symbol>
 <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 0 1 0 12"/></symbol>
 <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></symbol>
 <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
 <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
 <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 5v14M16 12L6 5v14z"/></symbol>
 <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 5v14M8 12l10-7v14z"/></symbol>
 <symbol id="i-fist" viewBox="0 0 24 24"><path d="M12 3l2 5 5-2-2 5 5 2-5 2 2 5-5-2-2 5-2-5-5 2 2-5-5-2 5-2-2-5 5 2z"/></symbol>
 <symbol id="i-swirl" viewBox="0 0 24 24"><path d="M12 12m-1 0a1 1 0 1 0 2 0a1 1 0 1 0-2 0M12 8a4 4 0 1 1-4 4M12 4a8 8 0 1 1-8 8"/></symbol>
 <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
 <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8"/></symbol>
</svg>
<a class="skip-link" href="#main">Skip to the game</a>
<div id="app" data-view="home">
 <header class="bar">
  <button id="brand" class="brand" type="button" aria-label="Daily Silver, back to start"><img src="./assets/art/daily-silver-mark-96.png" alt="" width="42" height="42"><span>DAILY <b>SILVER</b></span></button>
  <p class="bar-title" id="bar-title" aria-live="off"></p>
  <nav class="bar-actions" aria-label="Game menu">
   <button id="journal-button" class="icon-btn" type="button" hidden aria-label="Battle journal and replay"><svg><use href="#i-list"/></svg></button>
   <button id="archive-button" class="icon-btn" type="button" aria-label="Archive and records"><svg><use href="#i-book"/></svg></button>
   <button id="help-button" class="icon-btn" type="button" aria-label="How to play"><svg><use href="#i-help"/></svg></button>
   <button id="sound-button" class="icon-btn" type="button" aria-pressed="false" aria-label="Sound off"><svg><use href="#i-mute"/></svg></button>
   <button id="settings-button" class="icon-btn" type="button" aria-label="Settings"><svg><use href="#i-sliders"/></svg></button>
  </nav>
 </header>
 <main id="main">
  <div class="stage-frame" id="stage-frame">
   <canvas id="stage-canvas" width="768" height="398" role="img" aria-label="Moonlit mountain summit battlefield"></canvas>
   <div class="home-overlay" id="home-overlay">
    <p class="kicker" id="home-kicker">Daily 0000</p>
    <h1>The summit<br>is waiting.</h1>
   </div>
   <div class="hud" id="hud" hidden>
    <div class="plate plate-foe" id="plate-foe"></div>
    <div class="plate plate-ally" id="plate-ally"></div>
    <p class="outcome" id="outcome" role="status" aria-live="off"></p>
   </div>
   <div class="intro-card" id="intro-card" hidden></div>
   <button class="skip-fab" id="skip-fab" type="button" hidden><svg><use href="#i-skip"/></svg><span id="skip-label">Skip</span></button>
  </div>
  <section class="panel" id="panel-home" aria-label="Start">
   <div class="cta">
    <button id="daily-button" class="btn btn-primary" type="button"><svg><use href="#i-play"/></svg><span id="daily-label">Begin today's battle</span></button>
    <button id="practice-button" class="btn btn-secondary" type="button"><svg><use href="#i-flask"/></svg><span>Practice lab</span></button>
    <button id="result-link" class="btn btn-quiet" type="button" hidden><span>View today's result</span></button>
    <p class="note" id="daily-note"></p>
   </div>
   <div class="team" aria-label="Today's team">
    <p class="team-label"><span>Today's six</span><span class="team-hint">Tap an ally to inspect</span></p>
    <ul class="team-list" id="team-list"></ul>
   </div>
  </section>
  <section class="panel" id="panel-battle" aria-label="Battle controls" hidden>
   <div class="command">
    <div class="command-head">
     <p class="command-state" id="command-state">Choose a move</p>
     <div class="command-tools" id="lab-tools" hidden>
      <span class="badge">Lab</span>
      <button class="chip-btn" id="lab-undo" type="button"><svg><use href="#i-undo"/></svg>Undo</button>
      <button class="chip-btn" id="lab-retry" type="button"><svg><use href="#i-retry"/></svg>Retry</button>
      <button class="chip-btn" id="lab-compare" type="button">Compare</button>
     </div>
     <button class="chip-btn chip-strong" id="party-button" type="button"><svg><use href="#i-swap"/></svg><span>Party</span></button>
    </div>
    <div class="moves" id="moves" role="group" aria-label="Moves"></div>
    <p class="lab-notes" id="lab-notes" hidden></p>
   </div>
  </section>
  <section class="panel" id="panel-replay" aria-label="Replay controls" hidden>
   <div class="replay">
    <div class="replay-row">
     <button class="icon-btn" id="rp-prev" type="button" aria-label="Previous knockout"><svg><use href="#i-prev"/></svg></button>
     <button class="icon-btn icon-big" id="rp-play" type="button" aria-label="Play"><svg><use href="#i-play"/></svg></button>
     <button class="icon-btn" id="rp-next" type="button" aria-label="Next knockout"><svg><use href="#i-next"/></svg></button>
     <label class="select-wrap"><span class="sr-only">Playback speed</span><select id="rp-speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
     <button class="chip-btn" id="rp-decisive" type="button">Decisive exchange</button>
     <button class="chip-btn" id="rp-download" type="button"><svg><use href="#i-down"/></svg>File</button>
     <button class="chip-btn" id="rp-exit" type="button">Exit</button>
    </div>
    <div class="timeline" id="timeline"><input id="rp-scrub" type="range" min="0" max="0" value="0" aria-label="Replay position"><div class="timeline-marks" id="rp-marks" aria-hidden="true"></div></div>
    <p class="note" id="rp-status"></p>
    <ul class="ko-list" id="rp-kos" aria-label="Knockouts"></ul>
   </div>
  </section>
  <section class="panel panel-results" id="panel-results" aria-label="Result" hidden>
   <div class="result" id="result-body"></div>
  </section>
 </main>
</div>
<dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
 <div class="sheet-head"><h2 id="sheet-title">Sheet</h2><button id="sheet-close" class="icon-btn" type="button" aria-label="Close"><svg><use href="#i-close"/></svg></button></div>
 <div class="sheet-body" id="sheet-body"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
